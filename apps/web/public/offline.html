<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Sem conexão · MyKids Printer</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; background: #f9f9f9; color: #302f2f; }
      header { background: #000; padding: 12px 16px; }
      header img { height: 34px; }
      section { background: #2174ff; color: #fff; padding: 24px 16px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 8px 0 0; line-height: 1.5; }
      main { padding: 16px; }
      button { width: 100%; min-height: 56px; border: 0; background: #2174ff; color: #fff; font: 700 16px Montserrat, Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; border-radius: 2px; }
    </style>
  </head>
  <body>
    <header><img src="/logo-incc.png" alt="INCC" /></header>
    <section>
      <h1>Sem conexão com o servidor</h1>
      <p>O celular não está alcançando o servidor de impressão da igreja. Confira se você está no Wi-Fi da igreja.</p>
    </section>
    <main><button onclick="location.reload()">Tentar de novo</button></main>
  </body>
</html>
