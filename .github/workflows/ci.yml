name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter web build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Renderer (iText)
        run: sh apps/renderer/fetch-libs.sh && mkdir -p apps/renderer/build && javac --release 17 -cp "apps/renderer/lib/*" -d apps/renderer/build apps/renderer/src/RenderServer.java

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem (sem publicar)
        run: docker build -t mykids-printer-web:ci .
